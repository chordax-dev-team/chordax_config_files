################# EUREKA - SERVER - SERVICE DISCOVERY ##################
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    serviceUrl.defaultZone: http://localhost:${server.port}/eureka   # point to itself, not 8761
  server:
    enable-self-preservation: false               # optional, for dev only
    wait-time-in-ms-when-sync-empty: 0
    maxThreadsForPeerReplication: 0               # <— disables peer replication
  instance.prefer-ip-address: true

########################### PORT #######################################
server.port: 8766